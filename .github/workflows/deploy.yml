name: Deploy

# Builds a production container image and publishes it to the GitHub Container
# Registry on every push to main (and on a version tag).
#
# ---------------------------------------------------------------------------
# WHAT WORKS WITH NO SETUP
#
# The build-and-push job below needs no secrets: it authenticates with the
# GITHUB_TOKEN that Actions provides automatically. Merge this and every push
# to main publishes:
#
#     ghcr.io/<owner>/<repo>:latest
#     ghcr.io/<owner>/<repo>:main-<sha>
#
# One-time step: after the first successful run, open
# https://github.com/users/<owner>/packages -> the package -> Package settings
# and set visibility to Public if you want it pullable without a login.
#
# ---------------------------------------------------------------------------
# WHAT NEEDS A TARGET
#
# "Deploy" means nothing until there is somewhere to deploy to. The `release`
# job at the bottom is a template: uncomment the block matching your host and
# add the listed repository secrets under
# Settings -> Secrets and variables -> Actions.
#
# It is deliberately left disabled rather than guessing a platform, so this
# file cannot fail on a repository that has no deployment target.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish an image built from code that does not pass its own tests.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: property_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms -d property_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://pms:pms@localhost:5432/property_management
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the registry, so a rebuild that only changes
          # application code does not reinstall every dependency.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Boots the real image against a real database and calls the API, so a
        # broken entrypoint or a missing dependency is caught here rather than
        # on the deployment target.
        run: |
          set -euo pipefail
          docker network create pms-net

          docker run -d --name pms-db --network pms-net \
            -e POSTGRES_USER=pms -e POSTGRES_PASSWORD=pms \
            -e POSTGRES_DB=property_management \
            postgres:16-alpine

          for i in $(seq 1 30); do
            docker exec pms-db pg_isready -U pms -d property_management && break
            sleep 2
          done
          docker exec pms-db psql -U pms -d property_management \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist"

          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name pms-app --network pms-net -p 8000:8000 \
            -e DJANGO_SECRET_KEY=smoke-test-key \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=False \
            -e DATABASE_URL=postgres://pms:pms@pms-db:5432/property_management \
            "$IMAGE"

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/schema/ >/dev/null && break
            sleep 2
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/properties)
          if [ "$code" != "401" ]; then
            echo "expected 401 from an unauthenticated request, got $code"
            docker logs pms-app
            exit 1
          fi
          echo "Published image boots, migrates and serves the API."

      - name: Image reference
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # RELEASE TO A HOST
  #
  # Disabled until a target exists. Pick one block, uncomment it, add the
  # secrets it names, and delete this `if: false`.
  # ---------------------------------------------------------------------------
  release:
    name: Release to hosting
    runs-on: ubuntu-latest
    needs: build-and-push
    if: false # <-- remove once a target below is configured

    steps:
      - uses: actions/checkout@v4

      # --- Render -----------------------------------------------------------
      # Secret required: RENDER_DEPLOY_HOOK_URL
      #   Render dashboard -> your service -> Settings -> Deploy Hook
      #
      # - name: Trigger Render deploy
      #   run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # --- Fly.io -----------------------------------------------------------
      # Secret required: FLY_API_TOKEN   (fly tokens create deploy)
      # Also needs a fly.toml committed at the repo root.
      #
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - name: Deploy to Fly
      #   run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # --- Railway ----------------------------------------------------------
      # Secret required: RAILWAY_TOKEN
      #
      # - name: Deploy to Railway
      #   run: |
      #     npm i -g @railway/cli
      #     railway up --service ${{ vars.RAILWAY_SERVICE }}
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # --- Any Docker host over SSH -----------------------------------------
      # Secrets required: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
      #
      # - name: Deploy over SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       docker pull ghcr.io/${{ github.repository }}:latest
      #       docker compose -f /srv/hmlet/docker-compose.prod.yml up -d
      #       docker image prune -f

      - name: No target configured
        run: |
          echo "No deployment target is configured yet." >> $GITHUB_STEP_SUMMARY
          echo "Uncomment a block in .github/workflows/deploy.yml." >> $GITHUB_STEP_SUMMARY
