line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # DRF/Django idiom: callables in argument defaults
]

[lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001"]
"tests/*" = ["B011"]
